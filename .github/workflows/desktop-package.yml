name: Windows portable package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build verified portable package
        shell: powershell
        run: .\desktop\Build-Desktop.ps1 -SkipSmokeTest

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: LEKALO-Pattern-Studio-win-x64
          path: dist-desktop/*.zip
          if-no-files-found: error
