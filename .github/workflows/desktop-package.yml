name: Windows portable package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release tag matches the application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must equal '$expectedTag'."
          }

      - name: Build verified portable package
        shell: powershell
        run: .\desktop\Build-Desktop.ps1

      - name: Upload portable package as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LEKALO-Pattern-Studio-win-x64
          path: |
            dist-desktop/*.zip
            dist-desktop/*.zip.sha256
          if-no-files-found: error

      - name: Attach portable package to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $repository = '${{ github.repository }}'
          $assets = @(Get-ChildItem -Path 'dist-desktop\*.zip', 'dist-desktop\*.zip.sha256' -File)
          if ($assets.Count -ne 2) {
            throw "Expected one ZIP and one SHA-256 file, found $($assets.Count)."
          }
          $assetPaths = @($assets.FullName)

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'LEKALO-release-workflow'
          }
          $encodedTag = [Uri]::EscapeDataString($tag)
          $releaseExists = $false
          try {
            Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$repository/releases/tags/$encodedTag" `
              -Headers $headers `
              -Method Get `
              -ErrorAction Stop | Out-Null
            $releaseExists = $true
          }
          catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) {
              throw
            }
          }

          if (-not $releaseExists) {
            & gh release create $tag --repo $repository --verify-tag --prerelease --generate-notes --title "ЛЕКАЛО $tag"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub Release $tag."
            }
          }

          & gh release upload $tag @assetPaths --repo $repository
          if ($LASTEXITCODE -ne 0) {
            throw "Could not attach the portable package to GitHub Release $tag."
          }
